[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pve-coldstandby"
version = "0.1.0"
description = "Boot-mode controller for a cold-standby Proxmox VE node"
requires-python = ">=3.11"
# The core runtime is stdlib-only by design. The MQTT selector is the one
# opt-in exception -- install it explicitly (`pip install pve-coldstandby[mqtt]`).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "paho-mqtt>=2.0"]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
coldstandby = "coldstandby.main:main"

[tool.setuptools]
packages = ["coldstandby", "coldstandby.selectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
