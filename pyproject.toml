[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pve-coldstandby"
version = "0.1.0"
description = "Boot-mode controller for a cold-standby Proxmox VE node"
requires-python = ">=3.11"
dependencies = []  # runtime is stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coldstandby = "coldstandby.main:main"

[tool.setuptools]
packages = ["coldstandby", "coldstandby.selectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
